apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: tradeforgeacr001.azurecr.io/tradeforge/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: WALLET_SERVICE_URL
              value: "http://wallet-service:8000"
            - name: PORTFOLIO_SERVICE_URL
              value: "http://portfolio-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 8000
      targetPort: 8000
