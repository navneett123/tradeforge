apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: dev
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
        - name: wallet-service
          image: tradeforgeacr001.azurecr.io/tradeforge/wallet-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: wallet-service
  ports:
    - port: 8000
      targetPort: 8000
