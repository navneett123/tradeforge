apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tradeforge-dev
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: REGISTRY_PLACEHOLDER/tradeforge-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: MARKET_URL
          value: "http://market-service:8000"
        - name: WALLET_URL
          value: "http://wallet-service:8000"
        - name: ORDER_URL
          value: "http://order-service:8000"
        - name: PORTFOLIO_URL
          value: "http://portfolio-service:8000"
        - name: RECO_URL
          value: "http://recommendation-service:8000"

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tradeforge-dev
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: LoadBalancer
---
