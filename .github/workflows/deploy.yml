name: TradeForge Deploy Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and Push Images
        run: |
          services=(
            "frontend:./frontend"
            "market-service:./services/market_service"
            "wallet-service:./services/wallet_service"
            "order-service:./services/order_service"
            "portfolio-service:./services/portfolio_service"
            "recommendation-service:./services/recommendation_service"
          )

          for item in "${services[@]}"; do
            name="${item%%:*}"
            path="${item#*:}"

            docker build \
              -t $ACR_LOGIN_SERVER/tradeforge/$name:${{ github.sha }} \
              -t $ACR_LOGIN_SERVER/tradeforge/$name:latest \
              $path

            docker push $ACR_LOGIN_SERVER/tradeforge/$name:${{ github.sha }}
            docker push $ACR_LOGIN_SERVER/tradeforge/$name:latest
          done

  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS Access
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy to DEV
        run: |
          kubectl apply -f k8s/dev/

      - name: Restart DEV Deployments
        run: |
          for deploy in frontend market-service wallet-service order-service portfolio-service recommendation-service; do
            kubectl rollout restart deployment/$deploy -n dev
          done

      - name: Verify DEV Rollouts
        run: |
          for deploy in frontend market-service wallet-service order-service portfolio-service recommendation-service; do
            kubectl rollout status deployment/$deploy -n dev --timeout=180s
          done

  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS Access
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy to PROD
        run: |
          kubectl apply -f k8s/prod/

      - name: Restart PROD Deployments
        run: |
          for deploy in frontend market-service wallet-service order-service portfolio-service recommendation-service; do
            kubectl rollout restart deployment/$deploy -n prod
          done

      - name: Verify PROD Rollouts
        run: |
          for deploy in frontend market-service wallet-service order-service portfolio-service recommendation-service; do
            kubectl rollout status deployment/$deploy -n prod --timeout=180s
          done

      - name: Rollback PROD on Failure
        if: failure()
        continue-on-error: true
        run: |
          for deploy in frontend market-service wallet-service order-service portfolio-service recommendation-service; do
            kubectl rollout undo deployment/$deploy -n prod || true
          done
