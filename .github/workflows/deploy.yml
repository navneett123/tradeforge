name: TradeForge Deploy Pipeline

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and Push Frontend
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/tradeforge/frontend:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/tradeforge/frontend:latest \
            ./frontend

          docker push $ACR_LOGIN_SERVER/tradeforge/frontend:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/tradeforge/frontend:latest

      - name: Build and Push Market Service
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/tradeforge/market-service:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/tradeforge/market-service:latest \
            ./services/market_service

          docker push $ACR_LOGIN_SERVER/tradeforge/market-service:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/tradeforge/market-service:latest

      - name: Build and Push Wallet Service
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/tradeforge/wallet-service:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/tradeforge/wallet-service:latest \
            ./services/wallet_service

          docker push $ACR_LOGIN_SERVER/tradeforge/wallet-service:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/tradeforge/wallet-service:latest

      - name: Build and Push Order Service
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/tradeforge/order-service:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/tradeforge/order-service:latest \
            ./services/order_service

          docker push $ACR_LOGIN_SERVER/tradeforge/order-service:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/tradeforge/order-service:latest

      - name: Build and Push Portfolio Service
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/tradeforge/portfolio-service:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/tradeforge/portfolio-service:latest \
            ./services/portfolio_service

          docker push $ACR_LOGIN_SERVER/tradeforge/portfolio-service:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/tradeforge/portfolio-service:latest

      - name: Build and Push Recommendation Service
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/tradeforge/recommendation-service:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/tradeforge/recommendation-service:latest \
            ./services/recommendation_service

          docker push $ACR_LOGIN_SERVER/tradeforge/recommendation-service:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/tradeforge/recommendation-service:latest

  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS Access
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy to DEV Namespace
        run: |
          kubectl apply -f k8s/dev/

      - name: Restart DEV Deployments
        run: |
          kubectl rollout restart deployment/frontend -n dev
          kubectl rollout restart deployment/market-service -n dev
          kubectl rollout restart deployment/wallet-service -n dev
          kubectl rollout restart deployment/order-service -n dev
          kubectl rollout restart deployment/portfolio-service -n dev
          kubectl rollout restart deployment/recommendation-service -n dev

      - name: Verify DEV Rollouts
        run: |
          kubectl rollout status deployment/frontend -n dev --timeout=180s
          kubectl rollout status deployment/market-service -n dev --timeout=180s
          kubectl rollout status deployment/wallet-service -n dev --timeout=180s
          kubectl rollout status deployment/order-service -n dev --timeout=180s
          kubectl rollout status deployment/portfolio-service -n dev --timeout=180s
          kubectl rollout status deployment/recommendation-service -n dev --timeout=180s

  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS Access
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy to PROD Namespace
        run: |
          kubectl apply -f k8s/prod/

      - name: Restart PROD Deployments
        run: |
          kubectl rollout restart deployment/frontend -n prod
          kubectl rollout restart deployment/market-service -n prod
          kubectl rollout restart deployment/wallet-service -n prod
          kubectl rollout restart deployment/order-service -n prod
          kubectl rollout restart deployment/portfolio-service -n prod
          kubectl rollout restart deployment/recommendation-service -n prod

      - name: Verify PROD Rollouts
        run: |
          kubectl rollout status deployment/frontend -n prod --timeout=180s
          kubectl rollout status deployment/market-service -n prod --timeout=180s
          kubectl rollout status deployment/wallet-service -n prod --timeout=180s
          kubectl rollout status deployment/order-service -n prod --timeout=180s
          kubectl rollout status deployment/portfolio-service -n prod --timeout=180s
          kubectl rollout status deployment/recommendation-service -n prod --timeout=180s

      - name: Rollback on Failure
        if: failure()
        run: |
          kubectl rollout undo deployment/frontend -n prod
          kubectl rollout undo deployment/market-service -n prod
          kubectl rollout undo deployment/wallet-service -n prod
          kubectl rollout undo deployment/order-service -n prod
          kubectl rollout undo deployment/portfolio-service -n prod
          kubectl rollout undo deployment/recommendation-service -n prod
